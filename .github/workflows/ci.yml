name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch supersedes the run still going for its last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, docs, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Every exported type must have a doc comment (CLAUDE.md), which
      # TypeDoc reports as a warning.
      - run: npm run docs -- --treatWarningsAsErrors
      - run: npm run build

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node `engines` allows, and the current one.
        node: ["22.18.0", 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  test-ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # All three: the view-sandboxing tests run in Firefox and WebKit too.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:ui -- --trace retain-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
